name: Windows tests

# The behaviour this program depends on most -- the recycle bin, the registry,
# NTFS permissions, junctions, long paths -- exists only on Windows, so the
# suite and the self-check run there as well as wherever a change was written.
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit to test (defaults to the one dispatched)"
        required: false

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Test suite
        shell: bash
        run: |
          status=0
          python run_tests.py > test-output.txt 2>&1 || status=$?
          echo "::group::Full output"; cat test-output.txt; echo "::endgroup::"
          echo "=== Failing tests ==="
          grep -E "^(FAIL|ERROR): " test-output.txt || true
          tail -n 3 test-output.txt
          exit $status
      - name: Self-check
        if: always()
        run: python main.py --selfcheck
