name: Windows tests

# The behaviour this program depends on most -- the recycle bin, the registry,
# NTFS permissions, junctions, long paths -- exists only on Windows, so the
# suite and the self-check run there as well as wherever a change was written.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Test suite
        run: python run_tests.py
      - name: Self-check
        run: python main.py --selfcheck
